<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Treaty Fruity</title>
</head>
<body>

<div class="Left">
    <img src="images/logo (1).svg" alt="logo">
    <div class="Social-icons">
        <img src="images/Twitter.svg">
        <img src="images/Facebook.svg">
        <img src="images/VK.svg">
        <img src="images/Thread.png">
        <img src="images/More.svg">
    </div>
</div>

<div class="Right">
    <header>
        <div class="Header-content">
            <nav>
                <ul>
                    <li>FLAVORS</li>
                    <li>STORE</li>
                    <li>BLOG</li>
                    <li>ABOUT US</li>
                </ul>
            </nav>

            <div class="Header-button">
                <img src="images/Find.svg">
                <img src="images/Store.svg">
                <img src="images/Avatar.png">
            </div>
        </div>
    </header>

    <main>    
        <div class="Main-left">
            <h1>
                <span class="treaty">Treaty</span>
                <span class="fruity">Fruity</span>
            </h1>

            <p>
                Treaty Fruity, a play on words with the term Tutti Fruitti,
                was developed with humans’ best friend in mind.
                It stands out through its unmatched snack formula made with fruit,
                without any added sugars or preservatives. Just like fruit!
            </p>

            <div class="Main-button">
                <button class="btn-1">ADD TO CART</button>
                <button class="btn-2">VIEW DETAIL</button>
            </div>
        </div>

        <div class="Main-images">
            <img src="images/Main-images.png">
        </div>
    </main>
</div>

</body>
</html>
